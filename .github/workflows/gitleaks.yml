# Secret Scanning (gitleaks) — Assessment P0 item 3, OpenAIMP/cfagent issue #143, #2497, #2499.
#
# WHAT: scans commits in the repository for secrets committed by accident.
# Runs as a required check on pull_request and merge_group (scanning merge-base..HEAD
# in ~9s) and runs a nightly full-history backstop scan on schedule.
#
# #2497 / #2499: uses the official MIT-licensed open-source gitleaks v8.24.2 release
# binary verified against its official SHA-256 digest before extraction.

name: Secret Scanning

on:
  pull_request:
    branches:
      - main
  merge_group:
  schedule:
    # Nightly full-history backstop at 04:23 UTC (#2499)
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Verify SHA-256 & Scan for Secrets with Gitleaks (OSS CLI)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          GITLEAKS_SHA256="fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
          TARBALL="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$TARBALL"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum --check --strict
          sudo tar -xz -f "$TARBALL" -C /usr/local/bin gitleaks
          rm -f "$TARBALL"
          gitleaks version

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git fetch origin main
            BASE_MERGE=$(git merge-base origin/main HEAD)
            gitleaks git --log-opts="${BASE_MERGE}..HEAD" --no-banner --redact --verbose
          else
            # Full-history backstop scan on nightly schedule and workflow_dispatch (#2499)
            gitleaks git --no-banner --redact --verbose
          fi
