# Auto-merge eligible PRs — issue #1509; enrollment fixed in #4305 / #4313.
#
# WHAT: labels an eligible PR, and ENQUEUES it once CI finishes. The merge queue
# owns the strategy (REBASE) and rebuilds the group on current main, so nothing
# here depends on an auto-merge request.
#
# WHY NOT auto-merge (verified 2026-11-12 on #4298): GitHub records an auto-merge
# request's method as the repository default — SQUASH on this repo — even when the
# mutation asks for `mergeMethod: REBASE`, and a SQUASH request cannot merge under
# a rebase-only ruleset. The PR then sits green, CLEAN and unmerged (#4267,
# #4219, #4244, #4283, #4285, #4297, #4303). Enrollment is the queue entry.
#
# WHY TWO TRIGGERS (#4299: two runs 14s apart; #4313):
# - `pull_request` labels the PR. It does NOT rely on a later `labeled` run: the
#   label this job adds would re-trigger it, which is the duplicate run the old
#   version produced on every PR. `labeled` is therefore not in the types list.
# - `workflow_run` on CI completion does the enqueue. An enqueue attempted at
#   `opened` is rejected while required checks are still running ("required
#   status checks have not succeeded"), and no pull_request event fires when they
#   finish — so the retry must hang off the CI run, as the old bot did.
#
# VERIFIED, NOT ASSUMED (#4317): after the enqueue the job reads the PR back and
# FAILS when it is not in the merge queue. A green check used to prove only that
# the job ran, while green PRs sat unenrolled (#4311, #4283, #4285, #4297, #4303).
# A draft is skipped — auto-ready-drafts flips it, and the flip brings it back here.
#
# TRIGGER SAFETY: plain `pull_request`, not the privileged target variant, which
# GitHub restricts on public repositories from 2026-12-02 (#4313). The labelling
# job never checks out or executes PR code. The enqueue job runs on the default
# branch (workflow_run semantics) and only calls the queue API.
#
# TOKEN: the labelling job uses the workflow's own token. The enqueue job needs
# the GitHub App token: `enqueuePullRequest` answers FORBIDDEN to the workflow
# token ("Resource not accessible by integration", observed on #4320), and the
# App's pull-requests + contents scopes are what the queue API accepts.
#
# SAFETY: no checkout, no PR code execution. The App token is short-lived,
# scoped to this one repository, and used only for the queue call. The required
# checks and the queue's merge-group validation remain the gate.

name: Auto-merge trusted PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: ["Continuous Integration & Test Verification"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  # One run per subject; an idempotent enqueue must not cancel an in-flight one.
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  label:
    name: Label PRs and enable auto-merge when mergeable
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Label the PR (lane from the body hashtag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          LANE_LABEL=""
          AGENT_TAG=$(echo "$PR_BODY" | grep -i -o -E '#[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -n "$AGENT_TAG" ]; then
            AGENT_ID=$(echo "$AGENT_TAG" | sed 's/^#//' | tr '[:upper:]' '[:lower:]')
            LANE_LABEL="lane:$AGENT_ID"
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "auto-merge" || true
          if [ -n "$LANE_LABEL" ]; then
            gh label create "$LANE_LABEL" --repo "$GITHUB_REPOSITORY" --color "ededed" --description "Agent ownership lane" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LANE_LABEL" || true
          fi

  enqueue:
    name: Enqueue the PR once CI finishes
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Create short-lived GitHub App token (queue API scope)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cfagent
          permission-contents: write
          permission-pull-requests: write

      - name: Enqueue the open PR for this branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Only PRs that carry this workflow's label are enrolled; a fork branch
          # has no label and is skipped by construction.
          PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
            --json number,id,isDraft,labels \
            --jq '[.[] | select(any(.labels[]?; .name == "auto-merge"))][0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "No open auto-merge PR for branch '$HEAD_BRANCH'; nothing to enqueue."
            exit 0
          fi
          PR_NODE_ID=$(echo "$PR_JSON" | jq -r '.id')
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          # A draft cannot be enqueued; auto-ready-drafts flips it once the gates
          # are green, and that flip brings the PR back here (#4317).
          if [ "$(echo "$PR_JSON" | jq -r '.isDraft')" = "true" ]; then
            echo "PR #$PR_NUMBER is a draft; auto-ready-drafts will flip it when the gates are green."
            exit 0
          fi

          # Enqueue. The entry IS the enrollment. An "already in the queue"
          # response is not a failure: the read-back below is the verdict.
          ENQUEUE=$(gh api graphql -F id="$PR_NODE_ID" -f query='
            mutation($id: ID!) {
              enqueuePullRequest(input: { pullRequestId: $id }) {
                mergeQueueEntry { position state }
              }
            }
          ' 2>&1 || true)
          echo "$ENQUEUE"

          # Verification (#4317): a green check proves the job ran, not that the
          # PR is enrolled. Read the queue state back and fail loudly when the
          # enrollment did not land — the silent version is what let green PRs
          # sit unenrolled (#4311, #4283, #4285, #4297, #4303).
          STATE_JSON=$(gh api graphql -F id="$PR_NODE_ID" -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on PullRequest {
                  isInMergeQueue
                  mergeStateStatus
                  autoMergeRequest { mergeMethod }
                }
              }
            }
          ' 2>&1 || true)
          echo "$STATE_JSON"
          IN_QUEUE=$(echo "$STATE_JSON" | jq -r '.data.node.isInMergeQueue // false' 2>/dev/null || echo false)
          if [ "$IN_QUEUE" != "true" ]; then
            echo "::error::PR #$PR_NUMBER is not in the merge queue after the enrollment attempt. Enqueue response: $ENQUEUE"
            exit 1
          fi
          echo "PR #$PR_NUMBER is enrolled in the merge queue."
