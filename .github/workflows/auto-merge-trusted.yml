# Auto-merge trusted PRs — issue #1509; enrollment fixed in #4305 / #4313 / #4444 / #4490.
#
# WHAT: labels an eligible PR, then ENROLLS it in the merge queue once its
# checks are green — from four triggers, event first:
#
#   - `workflow_run` (completion of any gate this workflow does not own:
#     CI, Policy Gate, CodeQL, Secret Scanning — PR-branch runs only): resolve
#     the PR by head branch and enroll when the WHOLE rollup is green. Each
#     gate that finishes is one more chance; the last one to finish is the one
#     that succeeds. This is the immediate path (#4490).
#   - `pull_request` (opened / synchronize / reopened / ready_for_review):
#     label the PR, then attempt enrollment immediately when the head is
#     already green. This carries a ready flip to the queue (#4346) — a flip
#     fires no CI completion.
#   - `schedule` (every 5 minutes): sweep open PRs carrying the configured
#     label and enroll every green, ready, conflict-free one. Backstop only:
#     GitHub throttles schedules on this repository (a */15 workflow ran ~5x a
#     day on 2026-11-13/14), so the schedule cannot be the primary retry.
#   - `workflow_dispatch`: manual sweep.
#
# WHY THE TRIGGERS CHANGED TWICE (#4444 then #4490). The original design hung
# enrollment on the CI workflow's completion, which races the compliance gate:
# the 19:10:24Z run on 2026-11-13 carried PR #4442's branch and was rejected —
# UNPROCESSABLE, required status check "Policy Gate" is in progress — with no
# retry. #4444 replaced that with a 5-minute sweep. The sweep works (a
# dispatched run enrolled #4483 in 16s) but its clock does not: 30+ minutes
# after the merge neither schedule had produced a single run, while an older
# `*/15` scheduled workflow was running about five times a day. So the retry is
# now the completion of every gate, with the whole rollup as the verdict — no
# race, no cron — and the sweep stays as a fallback that is allowed to be late.
#
# WHY THE ROLLUP IS THE VERDICT: a gate completing says nothing about the
# others. Reading the head's full statusCheckRollup means the decision is taken
# only when every required check has finished, whichever event woke the job.
#
# WHY NOT auto-merge (verified 2026-11-12 on #4298): GitHub records an
# auto-merge request's method as the repository default — SQUASH on this
# repo — even when the mutation asks for `mergeMethod: REBASE`, and a SQUASH
# request cannot merge under a rebase-only ruleset. The PR then sits green,
# CLEAN and unmerged (#4267, #4219, #4244, #4283, #4285, #4297, #4303).
# Enrollment is the queue entry; the queue owns the strategy (REBASE).
#
# TRIGGER SAFETY: plain `pull_request`, not the privileged target variant,
# which GitHub restricts on public repositories from 2026-12-02 (#4313). The
# labelling job never checks out or executes PR code; the enrollment job
# resolves the PR's node id from the API and only calls the queue API. The
# `workflow_run` trigger is filtered to `event == 'pull_request'`, so pushes to
# `main` never enter the enrollment path.
#
# TOKEN: the labelling job uses the workflow's own token. The enrollment job
# needs the GitHub App token — `enqueuePullRequest` answers FORBIDDEN to the
# workflow token ("Resource not accessible by integration", observed on
# #4320), and the App's pull-requests + contents scopes are what the queue
# API accepts.
#
# CONFIG: `config/auto-merge.json` is the single source for the label, the
# gating workflow set, the sweep limit and the excluded authors. The trigger
# list below repeats the gate names because a YAML trigger cannot read a config
# file; a pin keeps the two lists identical. The config itself is read from the
# default branch, so a pull request cannot widen its own eligibility; the one
# exception is the run that introduces the file, which reads its own ref and
# logs a warning.
#
# SAFETY: no checkout, no PR code execution. The App token is short-lived,
# scoped to this one repository, and used only for the queue call. The
# required checks and the queue's merge-group validation remain the gate.

name: Auto-merge trusted PRs


on:
  workflow_run:
    # The gates this workflow does not own — its own completion is excluded,
    # because watching itself would recurse. PR-branch completions only: a
    # push to `main` has no PR to enroll (guard on the job below).
    workflows:
      - "Continuous Integration & Test Verification"
      - "Policy Gate"
      - "CodeQL"
      - "Secret Scanning"
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    # Every 5 minutes — best-effort backstop only: this repository's schedules
    # are throttled to hours (#4490).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  # One run per subject; an idempotent enrollment must not cancel an in-flight
  # one. A sweep is one subject of its own.
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

env:
  CONFIG_PATH: config/auto-merge.json
  # Used only while the config has not reached the default branch (bootstrap).
  FALLBACK_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  # Every job name starts with this prefix, so the enrollment verdict can
  # ignore this workflow's own check runs: a failed attempt must stay visible
  # (#4317) without turning the head red and blocking its own retry.
  OWN_CHECK_PREFIX: "auto-merge:"

jobs:
  label:
    name: "auto-merge: label"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Read the automation config
        id: config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Default branch first: a pull request must not be able to change the
          # rules it is judged by. Bootstrap exception: until this file has
          # merged, the default branch does not carry it, so the run's own ref is
          # read with a loud warning. After the merge the fallback never fires.
          config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH" --jq '.content' 2>/dev/null | base64 -d || true)
          if [ -z "$config" ]; then
            echo "::warning::$CONFIG_PATH is not on the default branch yet; reading $FALLBACK_REF (bootstrap only)."
            config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$FALLBACK_REF" --jq '.content' | base64 -d)
          fi
          jq -e '.label and .sweepLimit and (.gatingWorkflows | length > 0)' <<<"$config" >/dev/null \
            || { echo "::error::$CONFIG_PATH is missing label, sweepLimit or gatingWorkflows"; exit 1; }
          echo "label=$(jq -r '.label' <<<"$config")" >> "$GITHUB_OUTPUT"
          echo "excluded=$(jq -c '.excludedAuthors // []' <<<"$config")" >> "$GITHUB_OUTPUT"

      - name: Label the PR (lane from the body hashtag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABEL: ${{ steps.config.outputs.label }}
          EXCLUDED: ${{ steps.config.outputs.excluded }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$(jq -rn --arg a "$AUTHOR_LOGIN" --argjson ex "$EXCLUDED" '$ex | index($a) != null')" = "true" ]; then
            echo "PR #$PR_NUMBER is authored by $AUTHOR_LOGIN (excluded by config) — not labelling it for automation."
            exit 0
          fi
          LANE_LABEL=""
          AGENT_TAG=$(echo "$PR_BODY" | grep -i -o -E '#[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -n "$AGENT_TAG" ]; then
            AGENT_ID=$(echo "$AGENT_TAG" | sed 's/^#//' | tr '[:upper:]' '[:lower:]')
            LANE_LABEL="lane:$AGENT_ID"
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL" || true
          if [ -n "$LANE_LABEL" ]; then
            gh label create "$LANE_LABEL" --repo "$GITHUB_REPOSITORY" --color "ededed" --description "Agent ownership lane" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LANE_LABEL" || true
          fi

  enroll:
    name: "auto-merge: enroll"
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    steps:
      - name: Read the automation config
        id: config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Default branch first: a pull request must not be able to change the
          # rules it is judged by. Bootstrap exception: until this file has
          # merged, the default branch does not carry it, so the run's own ref is
          # read with a loud warning. After the merge the fallback never fires.
          config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH" --jq '.content' 2>/dev/null | base64 -d || true)
          if [ -z "$config" ]; then
            echo "::warning::$CONFIG_PATH is not on the default branch yet; reading $FALLBACK_REF (bootstrap only)."
            config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$FALLBACK_REF" --jq '.content' | base64 -d)
          fi
          jq -e '.label and .sweepLimit and (.gatingWorkflows | length > 0)' <<<"$config" >/dev/null \
            || { echo "::error::$CONFIG_PATH is missing label, sweepLimit or gatingWorkflows"; exit 1; }
          echo "label=$(jq -r '.label' <<<"$config")" >> "$GITHUB_OUTPUT"
          echo "limit=$(jq -r '.sweepLimit' <<<"$config")" >> "$GITHUB_OUTPUT"
          echo "excluded=$(jq -c '.excludedAuthors // []' <<<"$config")" >> "$GITHUB_OUTPUT"

      - name: Create short-lived GitHub App token (queue API scope)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cfagent
          permission-contents: write
          permission-pull-requests: write

      - name: Enroll
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          LABEL: ${{ steps.config.outputs.label }}
          SWEEP_LIMIT: ${{ steps.config.outputs.limit }}
          EXCLUDED: ${{ steps.config.outputs.excluded }}
        run: |
          set -euo pipefail
          FAILED=0

          # The one enrollment decision, for one PR. Returns non-zero (and marks
          # FAILED) when the queue read-back says the enrollment did not land
          # (#4317: a green check proves the job ran, not that the PR is queued).
          enroll() {
            local node_id="$1" pr_number="$2" state verdict IN_QUEUE merge_state merge_method
            state=$(gh api graphql -F id="$node_id" -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest {
                    isInMergeQueue
                    mergeStateStatus
                    autoMergeRequest { mergeMethod }
                    commits(last: 1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            contexts(first: 100) {
                              nodes {
                                __typename
                                ... on CheckRun { name status conclusion }
                                ... on StatusContext { context state }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' 2>&1 || true)
            IN_QUEUE=$(echo "$state" | jq -r '.data.node.isInMergeQueue // false' 2>/dev/null || echo false)
            merge_state=$(echo "$state" | jq -r '.data.node.mergeStateStatus // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)
            merge_method=$(echo "$state" | jq -r '.data.node.autoMergeRequest.mergeMethod // "none"' 2>/dev/null || echo none)
            # Green means: every check on the head that is NOT this workflow's
            # own either succeeded or never needed to run. Own checks are
            # excluded so a failed attempt cannot make the head look red and
            # block the next sweep from retrying it.
            verdict=$(echo "$state" | jq -r --arg p "$OWN_CHECK_PREFIX" '
              [ .data.node.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                | select((((.name // .context) // "") | startswith($p)) | not)
                | (.conclusion // .state // "UNKNOWN") ] as $others
              | if ($others | length) == 0 then "MISSING"
                elif ($others | map(. == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED") | all) then "SUCCESS"
                else "NOT_GREEN" end
            ' 2>/dev/null || echo MISSING)
            echo "PR #$pr_number: queue=$IN_QUEUE checks=$verdict mergeState=$merge_state autoMerge=$merge_method"
            if [ "$IN_QUEUE" = "true" ]; then
              echo "PR #$pr_number is already in the merge queue."
              return 0
            fi
            if [ "$verdict" != "SUCCESS" ]; then
              echo "PR #$pr_number is not green ($verdict) — leaving it for the next sweep, not enrolling."
              return 0
            fi
            if [ "$merge_state" = "DIRTY" ] || [ "$merge_state" = "CONFLICTING" ]; then
              echo "PR #$pr_number has merge conflicts — not enrolling; resolve them first."
              return 0
            fi

            local enqueue
            enqueue=$(gh api graphql -F id="$node_id" -f query='
              mutation($id: ID!) {
                enqueuePullRequest(input: { pullRequestId: $id }) {
                  mergeQueueEntry { position state }
                }
              }
            ' 2>&1 || true)
            echo "$enqueue"

            local after IN_QUEUE
            after=$(gh api graphql -F id="$node_id" -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest { isInMergeQueue mergeStateStatus }
                }
              }
            ' 2>&1 || true)
            IN_QUEUE=$(echo "$after" | jq -r '.data.node.isInMergeQueue // false' 2>/dev/null || echo false)
            if [ "$IN_QUEUE" != "true" ]; then
              echo "::error::PR #$pr_number is not in the merge queue after the enrollment attempt. Enqueue response: $enqueue State: $after"
              FAILED=1
              return 0
            fi
            echo "PR #$pr_number is enrolled in the merge queue."
          }

          # One decision for one PR payload. Enrolls when the PR is labeled,
          # not excluded and not a draft; otherwise leaves it for the next pass.
          try_pr() {
            local pr_json="$1" number author
            number=$(echo "$pr_json" | jq -r '.number')
            author=$(echo "$pr_json" | jq -r '.author.login // ""')
            if [ "$(echo "$pr_json" | jq -r --argjson ex "$EXCLUDED" '[(.author.login // ""), (.author.name // "")] | any(. as $a | ($ex | index($a)) != null)')" = "true" ]; then
              echo "PR #$number is authored by $author (excluded by config) — never enrolled."
              return 0
            fi
            # Enrollment is label-gated on every path. On `opened` the label job
            # may still be adding it, in which case the next pass enrolls.
            if [ "$(echo "$pr_json" | jq -r --arg l "$LABEL" '[.labels[]?.name] | index($l) != null')" != "true" ]; then
              echo "PR #$number does not carry $LABEL yet; the label job adds it and the next pass enrolls it."
              return 0
            fi
            if [ "$(echo "$pr_json" | jq -r '.isDraft')" = "true" ]; then
              echo "PR #$number is a draft; auto-ready-drafts flips it when green, then the next pass enrolls it."
              return 0
            fi
            enroll "$(echo "$pr_json" | jq -r '.id')" "$number"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # One PR, straight from the event payload.
            try_pr "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,id,isDraft,labels,author)"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # A gate completed. Resolve the PR by head branch (one open PR per
            # branch) and judge the whole rollup: only the last gate to finish
            # finds every check green, so only it enrolls. No race with
            # `Policy Gate` — it is part of the rollup (#4444 / #4490).
            PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
              --json number,id,isDraft,labels,author --jq '.[0] // empty')
            if [ -z "$PR_JSON" ]; then
              echo "No open PR for branch '$HEAD_BRANCH' (a main-branch completion has none); nothing to do."
              exit 0
            fi
            try_pr "$PR_JSON"
          else
            # Sweep: every open PR carrying the configured label. The label is
            # the opt-in gate; a maintainer who labels another PR has opted it
            # in, and excluded authors are still refused by try_pr.
            gh pr list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit "$SWEEP_LIMIT" \
              --json number,id,isDraft,author,labels > prs.json
            echo "Sweep: $(jq 'length' prs.json) open $LABEL PR(s)."
            # Process substitution, not a pipe: a pipe would run the loop in a
            # subshell and lose FAILED from the enroll calls.
            while read -r pr; do
              try_pr "$pr"
            done < <(jq -c '.[]' prs.json)
          fi
          if [ "$FAILED" != "0" ]; then
            echo "::error::At least one enrollment attempt did not land in the queue — see the errors above."
            exit 1
          fi
