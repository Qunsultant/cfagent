# Auto-merge eligible PRs — issue #1509; enrollment fixed in #4305 / #4313.
#
# WHAT: labels an eligible PR and ENQUEUES it. The merge queue owns the
# strategy (REBASE) and rebuilds the group on current main, so nothing here
# depends on an auto-merge request.
#
# WHY NOT auto-merge (verified 2026-11-12 on #4298): GitHub records an
# auto-merge request's method as the repository default — SQUASH on this repo —
# even when the mutation asks for `mergeMethod: REBASE`, and a SQUASH request
# cannot merge under a rebase-only ruleset. The PR then sits green, CLEAN and
# unmerged (#4267, #4219, #4244, #4283, #4285, #4297, #4303). Enrollment is
# therefore the queue entry, not an auto-merge request.
#
# TRIGGER: plain `pull_request`. GitHub restricts the privileged target-variant
# trigger on public repositories from 2026-12-02 (#4313), and this job never
# checks out or executes PR code — it labels and calls the queue API. The only
# behavioural difference is that a fork PR has a read-only token, so the job is
# skipped for forks (every agent PR is same-repo).
#
# SAFETY: no checkout, no PR code execution, no repository secrets beyond the
# workflow's own token scoped to labels + pull requests. The required checks and
# the queue's merge-group validation remain the gate.

name: Auto-merge trusted PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enqueue:
    name: Label PRs and enable auto-merge when mergeable
    # A fork PR runs with a read-only token; nothing to enroll there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Label eligible PR and enqueue it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          LANE_LABEL=""
          AGENT_TAG=$(echo "$PR_BODY" | grep -i -o -E '#[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -n "$AGENT_TAG" ]; then
            AGENT_ID=$(echo "$AGENT_TAG" | sed 's/^#//' | tr '[:upper:]' '[:lower:]')
            LANE_LABEL="lane:$AGENT_ID"
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "auto-merge" || true
          if [ -n "$LANE_LABEL" ]; then
            gh label create "$LANE_LABEL" --repo "$GITHUB_REPOSITORY" --color "ededed" --description "Agent ownership lane" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LANE_LABEL" || true
          fi

          if [ "$PR_IS_DRAFT" = "true" ]; then
            echo "Draft PR labeled. The queue accepts it once it is ready for review."
            exit 0
          fi

          # Enqueue. The entry is the enrollment: the queue picks the strategy
          # and validates the group on current main. An "already in the queue"
          # response is success, not a failure (the labeled event re-runs this).
          gh api graphql -F id="$PR_NODE_ID" -f query='
            mutation($id: ID!) {
              enqueuePullRequest(input: { pullRequestId: $id }) {
                mergeQueueEntry { position state }
              }
            }
          ' || true

          # Read the enrollment back and say what it is: a queue entry merges,
          # an auto-merge request does not (#4305).
          gh api graphql -F id="$PR_NODE_ID" -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on PullRequest {
                  isInMergeQueue
                  mergeStateStatus
                  autoMergeRequest { mergeMethod }
                }
              }
            }
          ' || true
