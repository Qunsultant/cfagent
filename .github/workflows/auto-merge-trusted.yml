# Auto-merge eligible PRs — issue #1509.
#
# WHAT: automatically applies `auto-merge` and enables GitHub auto-merge
# (rebase only) for PRs targeting main, with no withhold reasons.
# All green PRs auto-merge via the bot + merge queue, including
# bot-authored, Jules-created, and workflow-touching PRs.
# Draft PRs are labeled automatically; GitHub can merge them only
# after they are marked ready.
# HOLD REMOVED (owner decision 2026-11-01, issue #2670, superseding the
# narrowing decision): the #1894 hold logic (bot authors, deletions,
# workflow files, Jules) is removed entirely. Remaining safety net:
# the required checks (Policy Gate including its no-deletion rule,
# Gitleaks, Test & Build, Load Active Environment) plus merge-queue
# validation on the merge-group commit.
# Enabling auto-merge merges NOTHING by itself: GitHub merges only
# when every requirement passes (required checks green, conversations
# resolved, and — once the queue is on — queue validation on the
# merge-group commit).
#
# SAFETY: use pull_request_target only to inspect PR metadata, apply a
# label, and request auto-merge. Never check out or execute PR code in
# this privileged workflow. All changed files, including workflow files, follow
# the same required-check and conversation-resolution gates.
#
# NOTE: removing the label does NOT disable auto-merge once enabled —
# disable it on the PR page if you change your mind.
#
# Uses the same narrowly scoped GitHub App credentials as
# auto-update-prs-app.yml. App-token-authenticated merges trigger the normal
# push workflows on main; GITHUB_TOKEN-authenticated merges do not.
# Prerequisite: General → "Allow auto-merge" must be ON, or PR-level
# auto-merge does not exist at all.

name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: Label PRs and enable auto-merge when mergeable
    runs-on: ubuntu-24.04
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cfagent
          permission-contents: write
          permission-pull-requests: write

      - name: Label eligible PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          LANE_LABEL=""
          AGENT_TAG=$(echo "$PR_BODY" | grep -i -o -E '#[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -n "$AGENT_TAG" ]; then
            AGENT_ID=$(echo "$AGENT_TAG" | sed 's/^#//' | tr '[:upper:]' '[:lower:]')
            LANE_LABEL="lane:$AGENT_ID"
          fi

          # Hold removed (owner decision 2026-11-01, issue #2670,
          # superseding the narrowing decision): no withhold reasons
          # remain. All green PRs auto-merge via the bot + merge queue,
          # including bot-authored, Jules-created, and workflow-touching
          # PRs. Remaining safety net: the required checks (Policy Gate
          # including its no-deletion rule, Gitleaks, Test & Build, Load
          # Active Environment) plus merge-queue validation.

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "auto-merge" || true
          if [ -n "$LANE_LABEL" ]; then
            gh label create "$LANE_LABEL" --repo "$GITHUB_REPOSITORY" --color "ededed" --description "Agent ownership lane" --force 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LANE_LABEL" || true
          fi
          if [ "$PR_IS_DRAFT" = "true" ]; then
            echo "Draft PR labeled. GitHub will allow merging after it is marked ready for review."
            exit 0
          fi
          # Enroll the PR with mergeMethod: REBASE via GraphQL so that GitHub
          # immediately adds it to the merge queue (or enables auto-merge with REBASE)
          # instead of defaulting to SQUASH (which is disallowed by ruleset and stalls PRs).
          # Note: REST API returns .auto_merge.merge_method (lowercase e.g. "squash")
          # while GraphQL returns autoMergeRequest.mergeMethod (uppercase e.g. "SQUASH").
          PR_INFO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{node_id: .node_id, method: (.auto_merge.merge_method // .auto_merge_request.merge_method // empty)}' 2>/dev/null || true)
          PR_NODE_ID=$(echo "$PR_INFO" | jq -r '.node_id // empty' 2>/dev/null || true)
          CURRENT_METHOD=$(echo "$PR_INFO" | jq -r '.method // empty' 2>/dev/null | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "$PR_NODE_ID" ]; then
            if [ -n "$CURRENT_METHOD" ] && [ "$CURRENT_METHOD" != "REBASE" ]; then
              echo "Auto-merge currently configured with $CURRENT_METHOD; resetting to REBASE..."
              gh api graphql -F id="$PR_NODE_ID" -f query='
                mutation($id: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                    pullRequest { autoMergeRequest { mergeMethod } }
                  }
                }
              ' || true
            fi
            gh api graphql -F id="$PR_NODE_ID" -f query='
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: REBASE }) {
                  pullRequest {
                    isInMergeQueue
                    autoMergeRequest {
                      mergeMethod
                    }
                  }
                }
              }
            ' || gh pr merge "$PR_NUMBER" --auto --repo "$GITHUB_REPOSITORY" || true
          else
            gh pr merge "$PR_NUMBER" --auto --repo "$GITHUB_REPOSITORY" || true
          fi
