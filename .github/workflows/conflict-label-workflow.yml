# Detection only (issue #1853): label open PRs that become conflicted when
# main moves. This workflow NEVER resolves a conflict and NEVER pushes to a
# PR branch. It only adds or removes the `has-conflicts` label.
# Note: workflow files cannot be written via the GitHub API, so this file
# was created through the repo owner's web UI (see issue #1853).
name: Label conflicted PRs

on:
  push:
    branches:
      - main
  pull_request:
    types: [synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: conflict-label
  cancel-in-progress: false

jobs:
  label-conflicts:
    name: Label PRs with merge conflicts
    runs-on: ubuntu-24.04
    steps:
      - name: Label dirty PRs, unlabel clean ones
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'has-conflicts';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: LABEL,
                  color: 'd73a4a',
                  description: 'PR has merge conflicts that must be resolved before merge',
                });
              } else {
                throw error;
              }
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
            });
            for (const pr of prs) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              // mergeable_state can be null while GitHub computes it; never
              // remove a label on an unknown state.
              if (data.mergeable_state === null || data.mergeable_state === undefined) {
                console.log(`PR #${pr.number}: state unknown, skipping`);
                continue;
              }
              const hasLabel = (data.labels || []).some((l) => l.name === LABEL);
              if (data.mergeable_state === 'dirty' && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
                console.log(`PR #${pr.number}: labeled (dirty)`);
              } else if (data.mergeable_state !== 'dirty' && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: LABEL,
                });
                console.log(`PR #${pr.number}: unlabeled (${data.mergeable_state})`);
              }
            }
