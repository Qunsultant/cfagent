name: Deploy NextGenTP

# Runner pin: ubuntu-24.04 everywhere below. ubuntu-latest began migrating
# toward Ubuntu 26 and segfaulted deploys (exit 139, #596). Pin until a
# runner migration is a deliberate, tested change.

on:
  # Issue #2556: Deploy only after CI validation completes successfully on main
  workflow_run:
    workflows: ["Continuous Integration & Test Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target GitHub Environment (overrides environment.config.json)"
        required: false
        default: "CONFIG"
        type: choice
        options:
          - "CONFIG"
          - "PROD"
          - "TEST"

jobs:
  # ── Step 1: read environment.config.json or input to determine target environment ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-24.04
    # Issue #2556: Ensure deployment runs only on green CI or explicit manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            environment.config.json

      - name: Read Active Environment from Config or Input
        id: read-env
        run: |
          INPUT_ENV="${{ github.event.inputs.target_env }}"
          if [ -n "$INPUT_ENV" ] && [ "$INPUT_ENV" != "CONFIG" ]; then
            TARGET_ENV="$INPUT_ENV"
          else
            TARGET_ENV=$(jq -r '.environment' environment.config.json)
          fi
          echo "Active target environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ── Step 2: build & deploy using secrets from the GitHub Environment ──
  deploy:
    runs-on: ubuntu-24.04
    # Backstop for the secret-push steps: a hung Cloudflare API call is bounded
    # per attempt (see put_secret) and the whole job must never sit for hours.
    timeout-minutes: 30
    name: Build & Deploy [${{ needs.load-environment.outputs.target_env }}]
    needs: load-environment
    environment: ${{ needs.load-environment.outputs.target_env }}
    permissions:
      contents: read

    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      # Issue #523: the full test suite intentionally does NOT run here.
      # ci.yml already runs the identical suite (npm run test:ci) on the PR
      # and again on the push to main, so the code being deployed is tested.
      # Re-running it in the deploy job doubled exposure to the suite's
      # low-rate nondeterministic failures and let a test flake block a
      # production deploy of verified code (2026-10-20, main @ b01142c).
      # Typecheck + build above/below remain this job's deterministic gates.
      # Do not re-add a test step here without reading #523.

      - name: Build frontend
        run: npm run build

      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="AGENT_SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating AGENT_SESSIONS namespace via API..."
            CREATE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"AGENT_SESSIONS"}')
            echo "Create response: $CREATE_RESP"
            KV_ID=$(echo "$CREATE_RESP" | jq -r '.result.id' 2>/dev/null || echo "")
          fi

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.jsonc with KV ID
        run: sed -i "s/<YOUR_KV_NAMESPACE_ID>/$KV_ID/g" wrangler.jsonc

      - name: Ensure Vectorize index for VectorMemory (PR #6)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if ! npx wrangler vectorize get vector-memory 2>/dev/null; then
            echo "Creating vector-memory index..."
            npx wrangler vectorize create vector-memory --dimensions 768 --metric cosine
          else
            echo "vector-memory index already exists"
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

  # ── Step 2b: sync Worker secrets (issue #590) ─────────────────────────
  # A separate, non-blocking job on purpose: the Worker code is already
  # deployed when this runs, so a Cloudflare secrets blip must not read as
  # "the code deploy failed", and tag release / QA must not wait on it.
  sync-secrets:
    runs-on: ubuntu-24.04
    name: Sync Worker secrets [${{ needs.load-environment.outputs.target_env }}]
    needs: [load-environment, deploy]
    environment: ${{ needs.load-environment.outputs.target_env }}
    timeout-minutes: 20
    continue-on-error: true
    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/put-secret.sh

      - name: Start secret sync summary
        run: |
          echo "## Worker secrets — $APP_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Code deploy \`${{ github.sha }}\` is already live; this job only refreshes Worker secrets." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Set core secrets on Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          S_GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          S_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          S_GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          S_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          S_APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          S_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S_DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY_IS_A2A_TOKEN }}
          S_SCREENER_SLACK_CHANNEL: ${{ secrets.SCREENER_SLACK_CHANNEL }}
          S_SCREENER_EMAIL_TO: ${{ secrets.SCREENER_EMAIL_TO }}
          S_CHANNEL_EMAIL_PRINCIPALS: ${{ secrets.CHANNEL_EMAIL_PRINCIPALS }}
        run: |
          set -euo pipefail
          source scripts/ci/put-secret.sh

          GH_ID="$S_GH_CLIENT_ID"
          if [ -z "$GH_ID" ]; then GH_ID="$S_GITHUB_CLIENT_ID"; fi
          GH_SEC="$S_GH_CLIENT_SECRET"
          if [ -z "$GH_SEC" ]; then GH_SEC="$S_GITHUB_CLIENT_SECRET"; fi

          # Auth/session secrets are required: an absent value is a
          # configuration failure, not a reason to skip the push.
          require_secret GITHUB_CLIENT_ID "$GH_ID"
          require_secret GITHUB_CLIENT_SECRET "$GH_SEC"
          require_secret APP_BASE_URL "$S_APP_BASE_URL"
          require_secret SESSION_SECRET "$S_SESSION_SECRET"
          require_secret DASHBOARD_API_KEY_IS_A2A_TOKEN "$S_DASHBOARD_API_KEY"

          # Notification targets are genuinely optional; absence is reported.
          optional_secret SCREENER_SLACK_CHANNEL "$S_SCREENER_SLACK_CHANNEL"
          optional_secret SCREENER_EMAIL_TO "$S_SCREENER_EMAIL_TO"
          optional_secret CHANNEL_EMAIL_PRINCIPALS "$S_CHANNEL_EMAIL_PRINCIPALS"

      - name: Set E*TRADE secrets on Cloudflare Worker [${{ needs.load-environment.outputs.target_env }}]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACTIVE_ENV_NAME: ${{ needs.load-environment.outputs.target_env }}
          S_ET_API_KEY: ${{ secrets.ET_API_KEY }}
          S_ETRADE_API_KEY: ${{ secrets.ETRADE_API_KEY }}
          S_ET_PROD_API_KEY: ${{ secrets.ET_PROD_API_KEY }}
          S_PROD_ET_API_KEY: ${{ secrets.PROD_ET_API_KEY }}
          S_ETRADE_CONSUMER_KEY: ${{ secrets.ETRADE_CONSUMER_KEY }}
          S_ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
          S_ETRADE_API_SECRET: ${{ secrets.ETRADE_API_SECRET }}
          S_ET_PROD_API_SECRET: ${{ secrets.ET_PROD_API_SECRET }}
          S_PROD_ET_API_SECRET: ${{ secrets.PROD_ET_API_SECRET }}
          S_ETRADE_CONSUMER_SECRET: ${{ secrets.ETRADE_CONSUMER_SECRET }}
          S_ET_BASE_URL: ${{ secrets.ET_BASE_URL }}
          S_ETRADE_BASE_URL: ${{ secrets.ETRADE_BASE_URL }}
        run: |
          set -euo pipefail
          source scripts/ci/put-secret.sh

          TARGET_KEY="$S_ET_API_KEY"
          if [ -z "$TARGET_KEY" ]; then TARGET_KEY="$S_ETRADE_API_KEY"; fi
          if [ -z "$TARGET_KEY" ]; then TARGET_KEY="$S_ET_PROD_API_KEY"; fi
          if [ -z "$TARGET_KEY" ]; then TARGET_KEY="$S_PROD_ET_API_KEY"; fi
          if [ -z "$TARGET_KEY" ]; then TARGET_KEY="$S_ETRADE_CONSUMER_KEY"; fi

          TARGET_SEC="$S_ET_API_SECRET"
          if [ -z "$TARGET_SEC" ]; then TARGET_SEC="$S_ETRADE_API_SECRET"; fi
          if [ -z "$TARGET_SEC" ]; then TARGET_SEC="$S_ET_PROD_API_SECRET"; fi
          if [ -z "$TARGET_SEC" ]; then TARGET_SEC="$S_PROD_ET_API_SECRET"; fi
          if [ -z "$TARGET_SEC" ]; then TARGET_SEC="$S_ETRADE_CONSUMER_SECRET"; fi

          if [ "$ACTIVE_ENV_NAME" = "PROD" ]; then
            DEFAULT_BASE="https://api.etrade.com/v1"
          else
            DEFAULT_BASE="https://apisb.etrade.com/v1"
          fi

          TARGET_URL="$S_ET_BASE_URL"
          if [ -z "$TARGET_URL" ]; then TARGET_URL="$S_ETRADE_BASE_URL"; fi
          if [ -z "$TARGET_URL" ]; then TARGET_URL="$DEFAULT_BASE"; fi

          echo "Target Environment: $ACTIVE_ENV_NAME"
          echo "Target Base URL: $TARGET_URL"
          echo "Key length: ${#TARGET_KEY}"
          echo "Secret length: ${#TARGET_SEC}"

          # Without broker credentials the screener and every order path are
          # dead, so an empty E*TRADE key is a hard failure.
          require_secret ET_API_KEY "$TARGET_KEY"
          if [ "$ACTIVE_ENV_NAME" = "PROD" ]; then
            require_secret ET_PROD_API_KEY "$TARGET_KEY"
          else
            require_secret ET_SANDBOX_API_KEY "$TARGET_KEY"
          fi

          require_secret ET_API_SECRET "$TARGET_SEC"
          if [ "$ACTIVE_ENV_NAME" = "PROD" ]; then
            require_secret ET_PROD_API_SECRET "$TARGET_SEC"
          else
            require_secret ET_SANDBOX_API_SECRET "$TARGET_SEC"
          fi

          require_secret ET_BASE_URL "$TARGET_URL"
          require_secret APP_ENV "$ACTIVE_ENV_NAME"

      - name: Set Payment Gateway secrets on Cloudflare Worker [${{ needs.load-environment.outputs.target_env }}]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
          MPP_SECRET_KEY: ${{ secrets.MPP_SECRET_KEY }}
        run: |
          set -euo pipefail
          source scripts/ci/put-secret.sh

          # Gateways differ per deployment, so each key stays optional — but
          # absence is now a warning plus a summary line, never a silent skip.
          optional_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          optional_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          optional_secret PAYPAL_CLIENT_ID "$PAYPAL_CLIENT_ID"
          optional_secret PAYPAL_CLIENT_SECRET "$PAYPAL_CLIENT_SECRET"
          optional_secret PAYPAL_ENVIRONMENT "$PAYPAL_ENVIRONMENT"
          optional_secret LEMONSQUEEZY_API_KEY "$LEMONSQUEEZY_API_KEY"
          optional_secret LEMONSQUEEZY_STORE_ID "$LEMONSQUEEZY_STORE_ID"
          optional_secret LEMONSQUEEZY_WEBHOOK_SECRET "$LEMONSQUEEZY_WEBHOOK_SECRET"
          optional_secret MPP_SECRET_KEY "$MPP_SECRET_KEY"

      - name: Set Google OAuth secrets on Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          S_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          S_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          source scripts/ci/put-secret.sh
      
          optional_secret GOOGLE_CLIENT_ID "$S_GOOGLE_CLIENT_ID"
          optional_secret GOOGLE_CLIENT_SECRET "$S_GOOGLE_CLIENT_SECRET"
          

      - name: Set Threads secrets on Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          S_THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/ci/put-secret.sh

          optional_secret THREADS_ACCESS_TOKEN "$S_THREADS_ACCESS_TOKEN"

      - name: Finish secret sync summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "All configured secrets synced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Secret sync failed — see the annotation above. The deployed code is unaffected; re-run this job after fixing the Cloudflare/GitHub secret." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Step 3: tag the deployed commit (issue #321) ──
  # Tags every successful deploy for rollback and release tracking.
  # Format: v0.1.<patch> auto-incrementing. Milestones bump minor/major manually.
  tag-release:
    runs-on: ubuntu-24.04
    name: Tag Release
    needs: deploy
    permissions:
      contents: write
    # Issue #2644: Align qa-smoke condition with deploy triggers (workflow_run from CI on main, workflow_dispatch, or push)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create release tag
        run: |
          # Get the latest v0.1.x tag, increment patch
          LATEST=$(git tag --list 'v0.1.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.1\.//')
            PATCH=$((PATCH + 1))
          fi
          TAG="v0.1.$PATCH"
          echo "Creating tag: $TAG for commit ${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy ${{ github.sha }} to production" ${{ github.sha }}
          git push origin "$TAG"
          echo "Tagged $TAG"
          # Hand the computed tags to the release step (issue #321 follow-up):
          # PREVIOUS_TAG scopes the generated notes to this deploy only.
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$LATEST" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error title=Release not published::RELEASE_TAG is empty; the tag step did not export it"
            exit 1
          fi
          # Idempotent: a re-run of the same commit keeps the existing notes.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its notes untouched."
            exit 0
          fi
          workdir="$(mktemp -d)"
          generated="$workdir/generated.md"
          notes="$workdir/notes.md"

          # Ask GitHub for exactly the commit list `--generate-notes` would
          # print, scoped to this deploy. A failure here costs the commit list,
          # never the release: the curated changelog is the point of the step.
          generate_args=(-f tag_name="$RELEASE_TAG")
          if [ -n "${PREVIOUS_TAG:-}" ]; then
            generate_args+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              "${generate_args[@]}" -q .body > "$generated"; then
            echo "::warning title=Generated notes unavailable::gh api generate-notes failed; publishing the curated changelog only"
            : > "$generated"
          fi

          # Curated entries on top, generated commits below, changelog link last.
          # Composition lives in the script (not inline bash) so section matching
          # and ordering are pinned by tests/release_notes_script.test.ts.
          node scripts/ci/release-notes.mjs \
            --tag "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --generated "$generated" \
            --repo "$GITHUB_REPOSITORY" \
            --out "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error title=Release not published::no release notes could be composed for $RELEASE_TAG"
            exit 1
          fi

          # One create with the finished body: `--generate-notes` cannot be
          # combined with --notes-file, and create-then-edit left a window where
          # a cancelled run published a release without its changelog.
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes"
          echo "Published $RELEASE_TAG with the curated changelog and this deploy's commit list."

  # ── Step 4: post-deploy QA smoke test (ported from cfpay) ──
  qa-smoke:
    runs-on: ubuntu-24.04
    name: Post-deploy QA
    needs: deploy
    permissions:
      contents: read
      issues: write
    concurrency:
      group: qa-smoke
      cancel-in-progress: false
    # Issue #2644: Align qa-smoke condition with deploy triggers (workflow_run from CI on main, workflow_dispatch, or push)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run QA checks against production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: https://agent.openaimp.com
          # #1754: service token for POST /api/qa/investigate (session-less
          # caller). Owner action: create the QA_INVESTIGATE_TOKEN GitHub
          # secret and set the same value as a Worker secret; until then
          # the smoke's AI-diagnosis comment warns 401 and is skipped.
          QA_INVESTIGATE_TOKEN: ${{ secrets.QA_INVESTIGATE_TOKEN }}
        run: node scripts/qa-smoke.mjs
