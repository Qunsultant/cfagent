# Auto-ready draft PRs when their checks go green — issue #4315; judgement
# corrected in #4325.
#
# WHAT: publish-early (#4054) creates a draft PR as soon as Tier 1 is green, but
# a draft never reaches the queue by itself. This workflow marks an eligible
# draft ready once its full gating set is green on the head SHA. The enrollment
# workflow (`auto-merge-trusted.yml`) then puts it in the merge queue — the flip
# fires `ready_for_review`, which that workflow acts on immediately, and both
# halves also run on every gating-workflow completion. One chain.
#
# WHY THE TRIGGER MOVED TWICE (#4325, then #4490): `workflow_run` does fire for
# PR branches — the 19:10:22Z run on 2026-11-13 evaluated PR #4442's head
# (`HEAD_BRANCH: fix/4441-autopilot-capabilities-doc`) — but it judged whichever
# gate finished first: "Not all gating workflows are green on e8ef2458", while
# `Policy Gate` was still in progress, and nothing re-evaluated when that gate
# passed. #4325 replaced it with a 5-minute sweep; on this repository that clock
# is throttled to hours (a `*/15` workflow ran ~5x/day), so the gate completion
# is the trigger again and the sweep is a backstop. The verdict is the whole set
# on the head, so only the last gate to finish flips a draft.
#
# The run query is filtered by `head_sha`, not a repo-wide window: the sweeps
# push a global window out within hours, and a head with no run in the window
# would read as pending forever.
#
# SCOPE: only open draft PRs carrying the configured `auto-merge` label — the
# marker that the PR is in the automated pipeline. Human drafts without the
# label are never touched.
#
# SAFETY: the full required set must be green on the head SHA, judged by the
# watcher's verdict logic — latest run per workflow name, cancelled/skipped never
# decides a verdict, a missing run is pending, never green. Marking ready merges
# NOTHING by itself: the merge queue re-validates every requirement.
#
# FLIP (#4495): `markPullRequestReadyForReview` (GraphQL). The REST endpoint
# `POST /pulls/{n}/ready_for_review` answers 404 on this repository even for an
# owner token, and the old catch-all reported the failure as "probably already
# ready — continuing", so a green run could sit behind a draft that never
# flipped (#4317 class). A flip that leaves the PR as a draft now fails the run.
#
# CONCURRENCY: grouped per head branch, so a main-branch completion cannot
# supersede and cancel a PR's pending evaluation.
#
# CONFIG: `config/auto-merge.json` is the single source for the label, the
# gating workflow set and the sweep limit, shared with `auto-merge-trusted.yml`
# and read from the default branch (the run that introduces it reads its own
# ref and logs a warning).
#
# TOKEN: the workflow's own scoped GITHUB_TOKEN (pull requests: write) — no App
# credentials are needed to mark a same-repo draft ready.

name: Auto-ready draft PRs

on:
  workflow_run:
    # Each gate completion is a chance to evaluate. The verdict needs the whole
    # set, so only the last gate to finish flips a draft — no cron involved
    # (#4490). Not this workflow itself: watching itself would recurse.
    workflows:
      - "Continuous Integration & Test Verification"
      - "Policy Gate"
      - "CodeQL"
      - "Secret Scanning"
      - "Auto-merge trusted PRs"
    types: [completed]
  schedule:
    # Every 5 minutes — best-effort backstop only; this repository throttles
    # schedules to hours (#4490).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Per head branch: a main-branch completion must not supersede and cancel a
  # PR's pending evaluation (#4495). A sweep is one subject of its own.
  group: auto-ready-${{ github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

env:
  CONFIG_PATH: config/auto-merge.json
  # Used only while the config has not reached the default branch (bootstrap).
  FALLBACK_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mark-ready:
    name: Mark eligible drafts ready when all checks are green
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Read the automation config
        id: config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Default branch first: a pull request must not be able to change the
          # rules it is judged by. Bootstrap exception: until this file has
          # merged, the default branch does not carry it, so the run's own ref is
          # read with a loud warning. After the merge the fallback never fires.
          config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH" --jq '.content' 2>/dev/null | base64 -d || true)
          if [ -z "$config" ]; then
            echo "::warning::$CONFIG_PATH is not on the default branch yet; reading $FALLBACK_REF (bootstrap only)."
            config=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$FALLBACK_REF" --jq '.content' | base64 -d)
          fi
          jq -e '.label and .sweepLimit and (.gatingWorkflows | length > 0)' <<<"$config" >/dev/null \
            || { echo "::error::$CONFIG_PATH is missing label, sweepLimit or gatingWorkflows"; exit 1; }
          {
            echo "label=$(jq -r '.label' <<<"$config")"
            echo "limit=$(jq -r '.sweepLimit' <<<"$config")"
            echo "gating=$(jq -c '.gatingWorkflows' <<<"$config")"
            echo "excluded=$(jq -c '.excludedAuthors // []' <<<"$config")"
          } >> "$GITHUB_OUTPUT"

      - name: Mark eligible drafts ready when all checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.config.outputs.label }}
          SWEEP_LIMIT: ${{ steps.config.outputs.limit }}
          GATING: ${{ steps.config.outputs.gating }}
          EXCLUDED: ${{ steps.config.outputs.excluded }}
        run: |
          set -euo pipefail
          FAILED=0

          # Eligible drafts: open + draft + the configured label, with the node
          # id (for the GraphQL flip) and the head SHA each one is judged on.
          PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
            --limit "$SWEEP_LIMIT" --json number,id,isDraft,headRefOid,author)
          # Excluded authors (Dependabot) are never flipped ready — owner rule,
          # 2026-11-14; the list lives in config/auto-merge.json.
          DRAFTS=$(printf '%s' "$PRS" | jq -r --argjson ex "$EXCLUDED" '
            .[] | select(.isDraft == true)
            | select(([(.author.login // ""), (.author.name // "")] | any(. as $a | ($ex | index($a)) != null)) | not)
            | "\(.number)\t\(.id)\t\(.headRefOid)"')
          if [ -z "$DRAFTS" ]; then
            echo "No eligible draft PRs."
            exit 0
          fi

          while IFS=$'\t' read -r PR PR_ID HEAD_SHA; do
            [ -n "$PR" ] || continue

            # Full required set green on this head? (watcher verdict logic:
            # latest run per workflow name, cancelled/skipped never decides a
            # verdict, a missing run is pending, never green.) The query is
            # filtered by head_sha so the window is this head's own runs.
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100")
            ALL_GREEN=$(printf '%s' "$RUNS" | jq -r --argjson want "$GATING" '
              [ .workflow_runs[]
                | select(.status == "completed")
                | select(.conclusion != "cancelled" and .conclusion != "skipped") ]
              | sort_by(.name) | group_by(.name) | map(max_by(.created_at))
              | map(select(.name as $n | $want | index($n)))
              | if (length == ($want | length)) then all(.conclusion == "success") else false end
            ')
            if [ "$ALL_GREEN" != "true" ]; then
              echo "PR #$PR: not every gating workflow is green on $HEAD_SHA yet — leaving it as-is."
              continue
            fi

            # Re-check the draft flag immediately before the flip: a human may
            # have flipped it meanwhile, in which case there is nothing to do.
            STILL_DRAFT=$(gh api graphql -F id="$PR_ID" -f query='
              query($id: ID!) { node(id: $id) { ... on PullRequest { isDraft } } }
            ' --jq '.data.node.isDraft')
            if [ "$STILL_DRAFT" != "true" ]; then
              echo "PR #$PR is no longer a draft — skipping."
              continue
            fi
            # GraphQL, not REST: POST /pulls/{n}/ready_for_review answers 404 on
            # this repository, even for an owner token (#4495). A failure is
            # loud unless the PR is already ready — the old "probably already
            # ready — continuing" is what let the draft stay draft behind a
            # green run (#4317 class, #4321, #4325).
            if OUT=$(gh api graphql -F id="$PR_ID" -f query='
              mutation($id: ID!) {
                markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                  pullRequest { isDraft }
                }
              }
            ' 2>&1); then
              echo "Marked PR #$PR ready for review; the enrollment workflow queues it."
            else
              AFTER=$(gh api graphql -F id="$PR_ID" -f query='
                query($id: ID!) { node(id: $id) { ... on PullRequest { isDraft } } }
              ' --jq '.data.node.isDraft' 2>/dev/null || echo unknown)
              if [ "$AFTER" = "false" ]; then
                echo "PR #$PR is already ready — nothing to do."
              else
                echo "::error::Could not mark PR #$PR ready (draft=$AFTER): $OUT"
                FAILED=1
              fi
            fi
          done <<< "$DRAFTS"

          if [ "$FAILED" != "0" ]; then
            echo "::error::At least one draft could not be flipped — see the errors above."
            exit 1
          fi
