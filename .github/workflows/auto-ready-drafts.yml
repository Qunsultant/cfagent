# Auto-ready draft PRs when their checks go green — issue #4315; trigger fixed
# in #4325.
#
# WHAT: publish-early (#4054) creates a draft PR as soon as Tier 1 is green, but
# a draft never reaches the queue by itself. This workflow marks an eligible
# draft ready once its full gating set is green on the head SHA. The enrollment
# workflow (`auto-merge-trusted.yml`) then puts it in the merge queue on its next
# pass — one chain, both halves on the same 5-minute cadence.
#
# WHY A SWEEP (#4325): the original trigger was `workflow_run` on the five
# gating workflows. GitHub does not deliver `workflow_run` for PR-branch runs in
# this repository — every delivery was a main-branch run — so a draft never
# became ready. The sweep is the replacement: every 5 minutes, evaluate the open
# labeled drafts, bounded lag, no event plumbing.
#
# SCOPE: only open draft PRs carrying the `auto-merge` label — the marker that
# the PR is in the automated pipeline. Human drafts without the label are never
# touched.
#
# SAFETY: the full required set must be green on the head SHA, judged by the
# watcher's verdict logic — latest run per workflow name, cancelled/skipped never
# decides a verdict, a missing run is pending, never green. Marking ready merges
# NOTHING by itself: the merge queue re-validates every requirement.
#
# TOKEN: the workflow's own scoped GITHUB_TOKEN (pull requests: write) — no App
# credentials are needed to mark a same-repo draft ready.

name: Auto-ready draft PRs

on:
  schedule:
    # Every 5 minutes; the enrollment workflow runs on the same cadence, so a
    # flipped draft is enrolled on the next pass (#4325 / #4346).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-ready-sweep
  cancel-in-progress: false

jobs:
  mark-ready:
    name: Mark eligible drafts ready when all checks are green
    runs-on: ubuntu-24.04
    steps:
      - name: Mark eligible drafts ready when all checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GATING="Continuous Integration & Test Verification|Policy Gate|CodeQL|Secret Scanning|Auto-merge trusted PRs"

          # Eligible drafts: open + draft + the auto-merge label, with the head
          # SHA each one is judged on.
          DRAFTS=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=50" --jq \
            '.[] | select(.draft == true) | select(.labels | map(.name) | index("auto-merge")) | [.number, .head.sha] | @tsv')
          if [ -z "$DRAFTS" ]; then
            echo "No eligible draft PRs."
            exit 0
          fi

          while IFS=$'\t' read -r PR HEAD_SHA; do
            [ -n "$PR" ] || continue

            # Full required set green on this head? (watcher verdict logic:
            # latest run per workflow name, cancelled/skipped never decides a
            # verdict, a missing run is pending, never green.)
            ALL_GREEN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" --jq "
              [ .workflow_runs[]
                | select(.head_sha == \"$HEAD_SHA\")
                | select(.status == \"completed\")
                | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\") ]
              | sort_by(.name) | group_by(.name) | map(max_by(.created_at))
              | map(select(.name | test(\"^($GATING)$\")))
              | select(length == 5)
              | all(.conclusion == \"success\")
            ")
            if [ "$ALL_GREEN" != "true" ]; then
              echo "PR #$PR: not all gating workflows are green on $HEAD_SHA — leaving it as-is."
              continue
            fi

            # Re-check the draft flag immediately before the POST; tolerate a
            # 422 (already ready — a human flipped it meanwhile).
            STILL_DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.draft')
            if [ "$STILL_DRAFT" != "true" ]; then
              echo "PR #$PR is no longer a draft — skipping."
              continue
            fi
            if gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/ready_for_review" --silent; then
              echo "Marked PR #$PR ready for review; the enrollment sweep will queue it once green."
            else
              echo "Could not mark PR #$PR ready (probably already ready) — continuing."
            fi
          done <<< "$DRAFTS"
