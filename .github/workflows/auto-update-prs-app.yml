name: Auto Update Open PRs (GitHub App)

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Continuous Integration & Test Verification"
      - "CodeQL"
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Auto-sync open unqueued PRs (#2546, #2555).
  # Kept scoped to unqueued auto-merge PRs that are behind main so Merge Queue
  # remains the sole updater for queued PRs (no O(N^2) storms or queue ejections).
  update-prs:
    name: Update open PRs with main
    runs-on: ubuntu-24.04
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cfagent
          permission-contents: write
          permission-pull-requests: write

      - name: Update Open PRs with main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
            });

            for (const pr of prs) {
              const isDependabot =
                pr.user?.login === 'dependabot[bot]' ||
                (pr.user?.login && pr.user.login.includes('dependabot')) ||
                (pr.head?.ref && pr.head.ref.startsWith('dependabot/'));

              if (isDependabot) {
                console.log(`Skipping Dependabot PR #${pr.number} (${pr.head.ref}) per reference-only policy.`);
                continue;
              }

              if (pr.draft) {
                console.log(`Skipping draft PR #${pr.number}`);
                continue;
              }

              const hasAutoMerge = (pr.labels || []).some((l) => l.name === 'auto-merge');
              if (!hasAutoMerge) {
                console.log(`Skipping PR #${pr.number} (auto-merge label not present).`);
                continue;
              }

              const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
              if (pr.head?.repo?.full_name !== baseRepo) {
                console.log(`Skipping fork PR #${pr.number} (${pr.head?.repo?.full_name ?? 'deleted fork'}); the App is installed only on ${baseRepo}.`);
                continue;
              }

              // Check if PR is already in the merge queue or has running CI checks (#2580, #2629)
              const queueQuery = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id
                      isInMergeQueue
                      mergeable
                      mergeStateStatus
                      autoMergeRequest {
                        mergeMethod
                      }
                      commits(last: 1) {
                        nodes {
                          commit {
                            statusCheckRollup {
                              state
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              let prDetails = null;
              try {
                const qRes = await github.graphql(queueQuery, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                });
                prDetails = qRes?.repository?.pullRequest;
                if (prDetails?.isInMergeQueue) {
                  console.log(`Skipping PR #${pr.number} (${pr.head.ref}); already in merge queue.`);
                  continue;
                }
              } catch (e) {
                console.log(`Could not query merge queue status for PR #${pr.number}: ${e.message}`);
              }

              if (prDetails) {
                const checkState = prDetails.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state;
                if (checkState === 'PENDING') {
                  console.log(`Skipping PR #${pr.number} (${pr.head.ref}); CI checks are currently running (state: PENDING). Protecting in-flight run from cancellation.`);
                  continue;
                }

                if (prDetails.mergeStateStatus === 'CLEAN' && prDetails.mergeable === 'MERGEABLE') {
                  if (!prDetails.isInMergeQueue) {
                    console.log(`PR #${pr.number} (${pr.head.ref}) is CLEAN and MERGEABLE but not in merge queue. Enqueuing into Merge Queue (#2629)...`);
                    const prId = prDetails.id || pr.node_id;
                    const amMethod = prDetails.autoMergeRequest?.mergeMethod;
                    if (amMethod && amMethod !== 'REBASE') {
                      console.log(`Resetting PR #${pr.number} auto-merge method from ${amMethod} to REBASE...`);
                      try {
                        await github.graphql(`
                          mutation($id: ID!) {
                            disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                              clientMutationId
                            }
                          }
                        `, { id: prId });
                      } catch (err) {
                        console.log(`Note resetting auto-merge for PR #${pr.number}: ${err.message}`);
                      }
                    }

                    try {
                      await github.graphql(`
                        mutation($id: ID!) {
                          enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: REBASE }) {
                            pullRequest {
                              isInMergeQueue
                            }
                          }
                        }
                      `, { id: prId });
                      console.log(`Enabled REBASE auto-merge for PR #${pr.number}`);
                    } catch (err) {
                      console.log(`Note enabling REBASE auto-merge for PR #${pr.number}: ${err.message}`);
                    }

                    try {
                      await github.graphql(`
                        mutation($id: ID!) {
                          enqueuePullRequest(input: { pullRequestId: $id }) {
                            clientMutationId
                          }
                        }
                      `, { id: prId });
                      console.log(`Enqueued PR #${pr.number} into Merge Queue.`);
                    } catch (eqErr) {
                      console.log(`Note enqueuing PR #${pr.number}: ${eqErr.message}`);
                    }
                  } else {
                    console.log(`Skipping PR #${pr.number} (${pr.head.ref}); already in merge queue.`);
                  }
                  continue;
                }

                if (prDetails.mergeStateStatus === 'DIRTY' || prDetails.mergeable === 'CONFLICTING') {
                  console.log(`Skipping PR #${pr.number} (${pr.head.ref}); PR has merge conflicts (DIRTY/CONFLICTING). Manual resolution required.`);
                  continue;
                }
              }

              try {
                console.log(`Updating PR #${pr.number} (${pr.head.ref})...`);
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                console.log(`Successfully requested branch update for PR #${pr.number}`);
              } catch (error) {
                console.error(`Failed to update PR #${pr.number}: ${error.message}`);
              }
            }
