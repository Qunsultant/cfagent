name: Continuous Integration & Test Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Required if a merge queue is ever enabled: the queue builds a temporary
  # merge commit per PR, and without this trigger that commit runs no checks.
  # Harmless otherwise. Deploy stays push-only.
  merge_group:
  workflow_dispatch:

# PR pushes cancel superseded runs (only the latest push's signal matters);
# main pushes always run to completion so deploy ordering stays intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Job 1: read environment.config.json, check docs-only fast path & non-transitive 24h tree dedup (#2497, #2499) ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
      tree_already_verified: ${{ steps.dedup.outputs.tree_already_verified }}
      verified_by_run_id: ${{ steps.dedup.outputs.verified_by_run_id }}
      docs_only: ${{ steps.dedup.outputs.docs_only }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          sparse-checkout: |
            environment.config.json

      - name: 🌐 Read Active Environment from Config
        id: read-env
        run: |
          TARGET_ENV=$(jq -r '.environment' environment.config.json)
          echo "Active environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: ⚡ Check Docs-Only Fast Path & Non-Transitive 24h Tree Dedup (#2497, #2499)
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TREE_SHA=$(git rev-parse 'HEAD^{tree}')
          echo "Current git tree SHA: $TREE_SHA"
          VERIFIED="false"
          MATCH_RUN=""
          DOCS_ONLY="false"

          # ── 1. Docs-only fast path on pull_request / merge_group (#2499) ──
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git fetch origin main --depth=50 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
            if [ -n "$CHANGED_FILES" ]; then
              NON_DOCS=$(echo "$CHANGED_FILES" | grep -v -E '^(docs/|changelog\.d/|CHANGELOG\.md$|README\.md$|.*\.md$)' || true)
              if [ -z "$NON_DOCS" ]; then
                DOCS_ONLY="true"
                VERIFIED="true"
                MATCH_RUN="docs-only"
                echo "All changed files are documentation/changelog markdown — enabling docs-only fast path."
                {
                  echo "### ⚡ Docs-Only Fast Path (#2499)"
                  echo "- **Git tree SHA (`HEAD^{tree}`)**: `$TREE_SHA`"
                  echo "- **Changed files**: documentation/changelog markdown only (`docs/`, `changelog.d/`, `*.md`)"
                  echo "- **Action**: Skipped `fast-gates` and 4x `test-shard` execution."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          # Helper: verify a candidate ci.yml run actually executed Fast gates + all 4 shards
          # (rejects transitive dedup runs or docs-only runs whose jobs were skipped).
          verify_anchor_jobs() {
            local run_id="$1"
            local jobs_json
            jobs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=30" 2>/dev/null || true)
            if [ -z "$jobs_json" ]; then
              return 1
            fi
            echo "$jobs_json" | jq -e '
              ([.jobs[] | select(.name == "Fast gates (typecheck + build)" and .conclusion == "success")] | length == 1) and
              ([.jobs[] | select((.name | test("^Tests (PR|MQ) \\(shard ")) and .conclusion == "success")] | length == 4)
            ' >/dev/null 2>&1
          }

          # ── 2. Non-transitive 24h tree-dedup anchor on merge_group / push (#2497, #2499) ──
          if [ "$VERIFIED" != "true" ] && { [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "push" ]; }; then
            CUTOFF_24H=$(date -u -d '24 hours ago' +"%Y-%m-%dT%H:%M:%SZ")
            CANDIDATES=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=success&per_page=40" \
              --jq ".workflow_runs[] | select(.head_commit.tree_id == \"$TREE_SHA\" and .run_started_at >= \"$CUTOFF_24H\") | .id" 2>/dev/null || true)

            for cand_id in $CANDIDATES; do
              if verify_anchor_jobs "$cand_id"; then
                MATCH_RUN="$cand_id"
                break
              fi
            done

            # On merge_group at queue position 1, if the PR branch was not manually
            # rebased onto main, its pull_request run tested refs/pull/<N>/merge.
            if [ -z "$MATCH_RUN" ] && [ "$EVENT_NAME" = "merge_group" ]; then
              PR_NUM=$(echo "$REF_NAME" | sed -n 's|^gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-.*|\1|p')
              if [ -n "$PR_NUM" ]; then
                PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM" 2>/dev/null || true)
                PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')
                PR_MERGE_SHA=$(echo "$PR_JSON" | jq -r '.merge_commit_sha // empty')
                if [ -n "$PR_HEAD_SHA" ] && [ -n "$PR_MERGE_SHA" ]; then
                  MERGE_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_MERGE_SHA" --jq '.tree.sha // empty' 2>/dev/null || true)
                  MAIN_TIME=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.committer.date // empty' 2>/dev/null || true)
                  if [ "$MERGE_TREE" = "$TREE_SHA" ] && [ -n "$MAIN_TIME" ]; then
                    PR_CANDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$PR_HEAD_SHA&status=success&per_page=10" \
                      --jq ".workflow_runs[] | select(.run_started_at > \"$MAIN_TIME\" and .run_started_at >= \"$CUTOFF_24H\") | .id" 2>/dev/null || true)
                    for cand_id in $PR_CANDS; do
                      if verify_anchor_jobs "$cand_id"; then
                        MATCH_RUN="$cand_id"
                        break
                      fi
                    done
                  fi
                fi
              fi
            fi

            if [ -n "$MATCH_RUN" ]; then
              VERIFIED="true"
              RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$MATCH_RUN"
              echo "Tree $TREE_SHA already verified within 24h by full CI run #$MATCH_RUN ($RUN_URL) — skipping redundant test execution."
              cat <<EOF >> "$GITHUB_STEP_SUMMARY"
### ⚡ Tree-Hash CI Deduplication (#2497, #2499)
- **Git tree SHA (\`HEAD^{tree}\`):** \`$TREE_SHA\`
- **Verified by full anchor run:** [#$MATCH_RUN]($RUN_URL) (\`Fast gates\` + 4/4 \`Tests\` shards executed & passed within 24h)
EOF
            fi
          fi

          echo "tree_already_verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "verified_by_run_id=$MATCH_RUN" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  # ── Job 2: fast deterministic gates — typecheck + build ──
  fast-gates:
    name: Fast gates (typecheck + build)
    runs-on: ubuntu-24.04
    needs: load-environment
    if: needs.load-environment.outputs.tree_already_verified != 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔍 TypeScript Strict Type Check
        run: npm run typecheck

      - name: 🏗️ Verify Frontend Production Bundle Build
        run: npm run build

      - name: 🛡️ Verify Cloudflare Worker Configuration
        run: npx wrangler --version

  # ── Job 3: test suite sharded across 4 parallel runners (Tests PR) ──
  test-shard-pr:
    name: Tests PR (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: [load-environment]
    if: github.event_name != 'merge_group' && needs.load-environment.outputs.tree_already_verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🧪 Execute Vitest Shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=verbose


  # ── Job 3: test suite sharded across 4 parallel runners (Tests MQ) ──
  test-shard-mq:
    name: Tests MQ (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: [load-environment, fast-gates]
    if: github.event_name == 'merge_group' && needs.load-environment.outputs.tree_already_verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🧪 Execute Vitest Shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=verbose


  # ── Job 4: the required check (ruleset name, do not rename) ──
  test-and-verify:
    name: Test & Build (Node 22) [${{ needs.load-environment.outputs.target_env }}]
    needs: [load-environment, fast-gates, test-shard-pr, test-shard-mq]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Report gate results
        run: |
          echo "load-environment:      ${{ needs.load-environment.result }}"
          echo "tree_already_verified: ${{ needs.load-environment.outputs.tree_already_verified }}"
          echo "verified_by_run_id:    ${{ needs.load-environment.outputs.verified_by_run_id }}"
          echo "docs_only:             ${{ needs.load-environment.outputs.docs_only }}"
          echo "fast-gates:            ${{ needs.fast-gates.result }}"
          echo "test-shard-pr:         ${{ needs.test-shard-pr.result }}"
          echo "test-shard-mq:         ${{ needs.test-shard-mq.result }}"

      - name: Fail unless every gate job succeeded
        run: |
          if [ "${{ needs.load-environment.result }}" != "success" ]; then
            echo "::error::load-environment did not succeed; the required check stays red."
            exit 1
          fi
          if [ "${{ needs.load-environment.outputs.tree_already_verified }}" = "true" ] && \
             [ "${{ needs.fast-gates.result }}" = "skipped" ] && \
             [ "${{ needs.test-shard-pr.result }}" = "skipped" ] && \
             [ "${{ needs.test-shard-mq.result }}" = "skipped" ]; then
            RUN_ID="${{ needs.load-environment.outputs.verified_by_run_id }}"
            if [ "$RUN_ID" = "docs-only" ]; then
              echo "Docs-only fast path verified. All gates passed."
              echo "✅ **Docs-only fast path**: no code/test files changed." >> "$GITHUB_STEP_SUMMARY"
            else
              RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
              echo "Git tree already verified within 24h by full CI run #$RUN_ID ($RUN_URL). All gates passed."
              echo "✅ **Verified by full anchor run**: [#$RUN_ID]($RUN_URL) (`Fast gates` + 4/4 `Tests` shards executed & passed within 24h)." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ "${{ needs.fast-gates.result }}" = "success" ] && \
             [ "${{ needs.test-shard-pr.result }}" = "success" ] && \
             [ "${{ needs.test-shard-mq.result }}" = "skipped" ]; then
            echo "PR event: fast-gates and test-shard-pr passed; test-shard-mq skipped as expected."
            exit 0
          fi
          if [ "${{ needs.fast-gates.result }}" = "success" ] && \
             [ "${{ needs.test-shard-mq.result }}" = "success" ] && \
             [ "${{ needs.test-shard-pr.result }}" = "skipped" ]; then
            echo "merge_group event: fast-gates and test-shard-mq passed; test-shard-pr skipped as expected."
            exit 0
          fi
          echo "::error::Unexpected gate results: fast-gates=${{ needs.fast-gates.result }}, test-shard-pr=${{ needs.test-shard-pr.result }}, test-shard-mq=${{ needs.test-shard-mq.result }}; the required check stays red."
          exit 1
